name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No cache: npm here — package-lock.json is gitignored in this repo
          # (deliberate choice), so there's no lockfile in a fresh checkout for
          # actions/setup-node to key a cache off of.
      - run: npm install
      - run: npm test
